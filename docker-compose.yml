services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qadam
      POSTGRES_USER: qadam
      POSTGRES_PASSWORD: qadam
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qadam -d qadam"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://qadam:qadam@db:5432/qadam
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media:
